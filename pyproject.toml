[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "http-download-benchmark"
version = "0.1.0"
description = "Measure ten sequential HTTP downloads with a compact terminal report."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "pyfiglet>=1.0.3,<2",
    "rich>=14.1,<15",
]

[project.scripts]
http-download-benchmark = "benchmark:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools]
py-modules = ["benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmark.py"]
addopts = "-ra --doctest-modules"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
